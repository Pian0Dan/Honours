project:
  type: book
  output-dir: docs
  pre-render: Rscript scripts/renv_prerender.R
  post-render: touch docs/.nojekyll
  resources:
    - scripts/intersection_inspector/www/icon-192.png
    - scripts/intersection_inspector/www/icon-512.png

book:
  title: "Are you in the room? A framework for sortition and representation"
  author: "Daniel Loza"
  favicon: scripts/intersection_inspector/www/logo-square.png
  chapters:
    - text: "Front matter"
      file: index.qmd
    - "01-chap1.qmd"
    - "02-chap2.qmd"
    - "03-chap3.qmd"
    - "04-chap4.qmd"
    - "05-chap5.qmd"
    - "06-chap6.qmd"
    - "refs.qmd"
  appendices:
    - "A-appA.qmd"
  sidebar:
    style: "docked"

bibliography:
  - thesisrefs.bib
  - packages.bib
csl: american-statistical-association.csl
degreetype: Bachelor of Commerce (Honours)
submitted: 2026
affiliation: Department of Econometrics & Business Statistics
degrees: 'AMusA (AMEB), B.Bus. (Monash University)'

format:
  monashthesis-html:
    include-in-header:
      text: |
        <link rel="apple-touch-icon" sizes="180x180" href="scripts/intersection_inspector/www/apple-touch-icon.png">
        <link rel="manifest" href="scripts/intersection_inspector/www/site.webmanifest">
  monashthesis-pdf:
    include-in-header:
      text: |
        \usepackage{enumitem}
        \setlistdepth{9}
        \renewlist{itemize}{itemize}{9}
        \setlist[itemize]{label=\textbullet}
